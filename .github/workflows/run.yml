name: 🔄 Update Currency Rates

on:
  #schedule:
  #  - cron: '0 6-17 * * 1-5'
  workflow_dispatch:

jobs:
  parse-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      actions: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true # ← Убирает жёлтое предупреждение
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: 🔄 Run Parser
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python update_sheets.py

      - name: 🗑️ Native Delete Old Runs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow "🔄 Update Currency Rates" --json databaseId --limit 50 | jq -r '.[].databaseId' | grep -v "${{ github.run_id }}" | xargs -I {} gh run delete {}
